syntax = "proto3";

package legend.protocol.v1;
option csharp_namespace = "Legend.Contracts.Proto";

// Error codes shared across protocol responses
enum ProtocolErrorCode {
  ERR_NONE = 0;
  ERR_VERSION_MISMATCH = 1001;
  ERR_AUTH_FAILED = 1002;
  ERR_INVALID_TOKEN = 1003;
  ERR_REALM_UNAVAILABLE = 1004;
  ERR_MOVE_BLOCKED = 1005;
  ERR_RATE_LIMITED = 1006;
  ERR_CHAR_NOT_FOUND = 1007;
  ERR_CHAR_NAME_TAKEN = 1008;
  ERR_INVALID_CLASS = 1009;
  ERR_CHAR_LIMIT = 1010;
  ERR_USERNAME_TAKEN = 1011;
  ERR_INVALID_SKILL = 1012;
  ERR_SKILL_COOLDOWN = 1013;
  ERR_OUT_OF_RANGE = 1014;
  ERR_SAFE_ZONE = 1015;
  ERR_INVALID_TARGET = 1016;
  ERR_LOOT_DENIED = 1017;
  ERR_DEAD = 1018;
  ERR_NOT_ENOUGH_GOLD = 1019;
  ERR_SHOP_DENIED = 1020;
  ERR_QUEST_DENIED = 1021;
  ERR_NPC_TOO_FAR = 1022;
  ERR_UNKNOWN_NPC = 1023;
  ERR_EQUIP_DENIED = 1024;
  ERR_ENHANCE_DENIED = 1025;
  ERR_USE_ITEM_DENIED = 1026;
  ERR_GUILD_DENIED = 1027;
  ERR_CHAT_DENIED = 1028;
  ERR_GUILD_NOT_FOUND = 1029;
  ERR_GUILD_NAME_TAKEN = 1030;
  ERR_ALREADY_IN_GUILD = 1031;
  ERR_GUILD_FULL = 1032;
  ERR_NOT_IN_GUILD = 1033;
  ERR_TRADE_DENIED = 1034;
  ERR_LISTING_NOT_FOUND = 1035;
  ERR_LISTING_LIMIT = 1036;
  ERR_SELF_BUY_DENIED = 1037;
  ERR_PARTY_DENIED = 1038;
  ERR_PARTY_FULL = 1039;
  ERR_ALREADY_IN_PARTY = 1040;
  ERR_NOT_IN_PARTY = 1041;
  ERR_PARTY_NOT_FOUND = 1042;
  ERR_FRIEND_DENIED = 1043;
  ERR_FRIEND_LIMIT = 1044;
  ERR_NOT_FRIEND = 1045;
  ERR_FRIEND_NOT_FOUND = 1046;
  ERR_TARGET_OFFLINE = 1047;
  ERR_SKILL_NOT_LEARNED = 1048;
  ERR_SKILL_LEARN_DENIED = 1049;
  ERR_SKILL_MAX_LEVEL = 1050;
  ERR_BUFF_DENIED = 1051;
  ERR_SIEGE_DENIED = 1052;
  ERR_SIEGE_NOT_ACTIVE = 1053;
  ERR_SIEGE_ALREADY_DECLARED = 1054;
  ERR_SIEGE_CONTESTED = 1055;
  ERR_MAIL_DENIED = 1056;
  ERR_MAIL_NOT_FOUND = 1057;
  ERR_MAIL_ATTACH_UNCLAIMED = 1058;
  ERR_MAIL_ALREADY_CLAIMED = 1059;
  ERR_MAIL_BAG_FULL = 1060;
  ERR_MAIL_FULL = 1061;
  ERR_DUNGEON_DENIED = 1062;
  ERR_DUNGEON_LEVEL = 1063;
  ERR_DUNGEON_COST = 1064;
  ERR_DUNGEON_NOT_IN = 1065;
  ERR_DUNGEON_FULL = 1066;
  ERR_DUNGEON_DAILY_LIMIT = 1067;
  ERR_DUNGEON_COOLDOWN = 1068;
  ERR_WORLD_BOSS_DENIED = 1069;
  ERR_WORLD_BOSS_NOT_ACTIVE = 1070;
  ERR_MOUNT_DENIED = 1071;
  ERR_FASHION_DENIED = 1072;
  ERR_MOVE_TOO_FAST = 1073;
  ERR_PET_DENIED = 1074;
  ERR_GUILD_WAREHOUSE_DENIED = 1075;
  ERR_GUILD_WAREHOUSE_FULL = 1076;
  ERR_GUILD_RANK_DENIED = 1077;
  ERR_GUILD_INVALID_RANK = 1078;
  ERR_INTERNAL = 1999;
}

enum EntityKind {
  ENTITY_PLAYER = 0;
  ENTITY_MONSTER = 1;
  ENTITY_LOOT = 2;
  ENTITY_NPC = 3;
  ENTITY_PET = 4;
}

enum CombatResultKind {
  COMBAT_HIT = 0;
  COMBAT_MISS = 1;
  COMBAT_HEAL = 2;
  COMBAT_KILL = 3;
}

enum QuestStatus {
  QUEST_NONE = 0;
  QUEST_ACTIVE = 1;
  QUEST_READY = 2;
  QUEST_COMPLETED = 3;
}

enum ChatChannel {
  CHAT_WORLD = 0;
  CHAT_NEARBY = 1;
  CHAT_GUILD = 2;
  CHAT_WHISPER = 3;
}

// 1. Handshake (MsgId: 1001 / 1002)
message HandshakeReq {
  string protocol_version = 1;
  string client_build = 2;
  string device_id = 3;
}

message HandshakeResp {
  bool accepted = 1;
  ProtocolErrorCode error_code = 2;
  string server_protocol_version = 3;
  string min_compatible_version = 4;
  string session_nonce = 5;
  int64 server_time_unix_ms = 6;
  string message = 7;
}

// 2. Register (MsgId: 1009 / 1010)
message RegisterReq {
  string username = 1;
  string password = 2;
  string client_platform = 3;
}

message RegisterResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string account_id = 3;
  string message = 4;
}

// 3. Login (MsgId: 1003 / 1004)
message LoginReq {
  string username = 1;
  string password = 2;
  string client_platform = 3;
}

message LoginResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string account_id = 3;
  string session_token = 4;
  string message = 5;
}

// 4. RealmList (MsgId: 1005 / 1006)
message RealmListReq {
  string session_token = 1;
}

message RealmInfo {
  string realm_id = 1;
  string realm_name = 2;
  string version_pack_id = 3;
  string status = 4;
  string host = 5;
  int32 port = 6;
  int32 online_count = 7;
}

message RealmListResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  repeated RealmInfo realms = 3;
}

// 5. Heartbeat (MsgId: 1007 / 1008)
message PingReq {
  int64 client_time_unix_ms = 1;
}

message PongResp {
  int64 client_time_unix_ms = 1;
  int64 server_time_unix_ms = 2;
}

// 6. Character management (MsgId: 1101–1108)
message CharacterSummary {
  string character_id = 1;
  string name = 2;
  string class_id = 3;
  int32 level = 4;
  string map_id = 5;
  int32 x = 6;
  int32 y = 7;
  int32 hp = 8;
  int32 max_hp = 9;
  int32 mp = 10;
  int32 max_mp = 11;
  int32 gold = 12;
  int32 exp = 13;
}

message CharListReq {
  string session_token = 1;
}

message CharListResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  repeated CharacterSummary characters = 3;
  string message = 4;
}

message CreateCharReq {
  string session_token = 1;
  string name = 2;
  string class_id = 3;
}

message CreateCharResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  CharacterSummary character = 3;
  string message = 4;
}

message DeleteCharReq {
  string session_token = 1;
  string character_id = 2;
}

message DeleteCharResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
}

message SelectCharReq {
  string session_token = 1;
  string character_id = 2;
}

message SelectCharResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  CharacterSummary character = 3;
  string message = 4;
}

// 7. EnterWorld & Entity Snapshot (MsgId: 2001 / 2002)
message EntitySnapshot {
  string entity_id = 1;
  string name = 2;
  string class_id = 3;
  string map_id = 4;
  int32 x = 5;
  int32 y = 6;
  int32 direction = 7;
  int32 hp = 8;
  int32 max_hp = 9;
  bool in_safe_zone = 10;
  EntityKind kind = 11;
  string template_id = 12;
  int32 quantity = 13;
  string owner_character_id = 14;
  // M15 appearance
  string mount_id = 15;
  string fashion_id = 16;
  int32 move_interval_ms = 17;
  // M16 active pet template id on player snapshot
  string pet_id = 18;
}

message EnterWorldReq {
  string session_token = 1;
  string realm_id = 2;
  string character_id = 3;
}

message EnterWorldResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string map_id = 3;
  EntitySnapshot self_entity = 4;
  repeated EntitySnapshot nearby_entities = 5;
  string message = 6;
  bool in_safe_zone = 7;
  repeated InventoryItem inventory = 8;
  int32 gold = 9;
  repeated QuestProgress quests = 10;
  repeated EquippedSlot equipment = 11;
  int32 effective_atk = 12;
  int32 effective_def = 13;
  int32 effective_max_hp = 14;
  int32 level = 15;
  int32 exp = 16;
  int32 exp_to_next = 17;
  int32 effective_max_mp = 18;
  string guild_id = 19;
  string guild_name = 20;
  string guild_rank = 21;
  repeated SkillState skills = 22;
  repeated BuffState buffs = 23;
  string siege_owner_guild_id = 24;
  string siege_owner_guild_name = 25;
  bool is_castle_lord_guild = 26;
}

// 8. AOI Movement (MsgId: 2003–2007)
message MoveReq {
  int32 to_x = 1;
  int32 to_y = 2;
  int32 direction = 3;
}

message MoveSync {
  string entity_id = 1;
  int32 from_x = 2;
  int32 from_y = 3;
  int32 to_x = 4;
  int32 to_y = 5;
  int32 direction = 6;
  bool accepted = 7;
  ProtocolErrorCode error_code = 8;
  string reason = 9;
  bool in_safe_zone = 10;
}

message EntityEnterAoi {
  EntitySnapshot entity = 1;
}

message EntityLeaveAoi {
  string entity_id = 1;
  string reason = 2;
}

message MapChangeNotify {
  string entity_id = 1;
  string from_map_id = 2;
  string to_map_id = 3;
  int32 to_x = 4;
  int32 to_y = 5;
  string portal_id = 6;
  bool in_safe_zone = 7;
  repeated EntitySnapshot nearby_entities = 8;
}

// 9. Combat & Loot (MsgId: 2101–2109)
message AttackReq {
  string target_entity_id = 1;
  string skill_id = 2;
}

message AttackResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  int32 remaining_mp = 4;
  int64 next_ready_unix_ms = 5;
}

message CombatSync {
  string attacker_entity_id = 1;
  string target_entity_id = 2;
  string skill_id = 3;
  CombatResultKind result = 4;
  int32 damage = 5;
  int32 heal = 6;
  int32 target_hp = 7;
  int32 target_max_hp = 8;
  bool target_died = 9;
  string map_id = 10;
}

message EntitySpawn {
  EntitySnapshot entity = 1;
  string reason = 2;
}

message EntityDespawn {
  string entity_id = 1;
  string reason = 2;
  string map_id = 3;
}

message LootDropNotify {
  EntitySnapshot loot = 1;
  string source_entity_id = 2;
  string killer_character_id = 3;
}

message InventoryItem {
  string item_id = 1;
  int32 count = 2;
}

message PickupReq {
  string loot_entity_id = 1;
}

message PickupResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  InventoryItem picked = 4;
  repeated InventoryItem inventory = 5;
}

message InventoryNotify {
  string character_id = 1;
  repeated InventoryItem items = 2;
  string reason = 3;
  int32 gold = 4;
}

// 10. NPC Shop & Quests (MsgId: 2201–2209)
message ShopOffer {
  string item_id = 1;
  int32 price_gold = 2;
  int32 stock = 3;
}

message QuestProgress {
  string quest_id = 1;
  string title = 2;
  QuestStatus status = 3;
  int32 progress = 4;
  int32 target_count = 5;
  string target_monster_id = 6;
  string description = 7;
}

message TalkReq {
  string npc_entity_id = 1;
}

message TalkResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string npc_id = 4;
  string npc_name = 5;
  string dialogue = 6;
  string shop_id = 7;
  repeated ShopOffer shop_offers = 8;
  repeated QuestProgress quests = 9;
  int32 gold = 10;
}

message ShopBuyReq {
  string npc_entity_id = 1;
  string item_id = 2;
  int32 count = 3;
}

message ShopBuyResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  InventoryItem purchased = 4;
  repeated InventoryItem inventory = 5;
  int32 gold = 6;
}

message QuestAcceptReq {
  string npc_entity_id = 1;
  string quest_id = 2;
}

message QuestAcceptResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  QuestProgress quest = 4;
}

message QuestTurnInReq {
  string npc_entity_id = 1;
  string quest_id = 2;
}

message QuestTurnInResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  QuestProgress quest = 4;
  int32 gold_reward = 5;
  repeated InventoryItem item_rewards = 6;
  int32 gold = 7;
  repeated InventoryItem inventory = 8;
}

message QuestProgressNotify {
  string character_id = 1;
  QuestProgress quest = 2;
  string reason = 3;
}

// 11. Equipment & Enhancement (MsgId: 2301–2306)
message EquippedSlot {
  string slot = 1;
  string item_id = 2;
  int32 enhance_level = 3;
  int32 atk_bonus = 4;
  int32 def_bonus = 5;
  int32 max_hp_bonus = 6;
}

message EquipReq {
  string item_id = 1;
  string slot = 2;
}

message EquipResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  repeated EquippedSlot equipment = 4;
  repeated InventoryItem inventory = 5;
  int32 effective_atk = 6;
  int32 effective_def = 7;
  int32 effective_max_hp = 8;
}

message UnequipReq {
  string slot = 1;
}

message UnequipResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  repeated EquippedSlot equipment = 4;
  repeated InventoryItem inventory = 5;
  int32 effective_atk = 6;
  int32 effective_def = 7;
  int32 effective_max_hp = 8;
}

message EnhanceEquipReq {
  string slot = 1;
}

message EnhanceEquipResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  bool enhance_succeeded = 4;
  EquippedSlot updated_slot = 5;
  repeated EquippedSlot equipment = 6;
  int32 gold = 7;
  int32 effective_atk = 8;
  int32 effective_def = 9;
  int32 effective_max_hp = 10;
}


// 12. Leveling & Consumables (MsgId: 2401–2404)
message UseItemReq {
  string item_id = 1;
  int32 count = 2; // usually 1
}

message UseItemResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string item_id = 4;
  int32 remaining_count = 5;
  int32 hp = 6;
  int32 max_hp = 7;
  int32 mp = 8;
  int32 max_mp = 9;
  repeated InventoryItem inventory = 10;
}

message ExpGainNotify {
  int32 gained_exp = 1;
  int32 total_exp = 2;
  int32 level = 3;
  int32 exp_to_next = 4;
  string source = 5; // e.g. monsterId
}

message LevelUpNotify {
  int32 old_level = 1;
  int32 new_level = 2;
  int32 exp = 3;
  int32 exp_to_next = 4;
  int32 base_atk = 5;
  int32 base_def = 6;
  int32 base_max_hp = 7;
  int32 base_max_mp = 8;
  int32 effective_atk = 9;
  int32 effective_def = 10;
  int32 effective_max_hp = 11;
  int32 hp = 12;
  int32 mp = 13;
}


// 13. Guild (MsgId: 2501–2508)
message GuildCreateReq {
  string name = 1;
}

message GuildCreateResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string guild_id = 4;
  string guild_name = 5;
  string guild_rank = 6;
  int32 gold = 7;
  int32 member_count = 8;
}

message GuildJoinReq {
  string guild_name = 1;
}

message GuildJoinResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string guild_id = 4;
  string guild_name = 5;
  string guild_rank = 6;
  int32 member_count = 7;
}

message GuildLeaveReq {
}

message GuildLeaveResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
}

message GuildInfoReq {
  string guild_id = 1; // empty = own guild
}

message GuildMemberInfo {
  string character_id = 1;
  string name = 2;
  string rank = 3;
}

message GuildInfoResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string guild_id = 4;
  string guild_name = 5;
  string leader_character_id = 6;
  repeated GuildMemberInfo members = 7;
}

// 14. Chat (MsgId: 2509–2510)
message ChatReq {
  ChatChannel channel = 1;
  string content = 2;
  // Whisper target character name (required when channel == CHAT_WHISPER)
  string target_name = 3;
}

message ChatNotify {
  ChatChannel channel = 1;
  string sender_entity_id = 2;
  string sender_name = 3;
  string content = 4;
  string guild_id = 5;
  int64 unix_ms = 6;
  string target_name = 7;
}

// 15. Server / Lua Notice (MsgId: 3001)
message ServerNotice {
  string notice_type = 1;
  string title = 2;
  string content = 3;
  string granted_item_id = 4;
  int32 granted_item_count = 5;
}

// 16. Stall / Player Trade Market (MsgId: 2601–2609)
message StallListingInfo {
  string listing_id = 1;
  string seller_character_id = 2;
  string seller_name = 3;
  string item_id = 4;
  int32 count = 5;
  int32 unit_price_gold = 6;
  int32 total_price_gold = 7;
  int64 created_unix_ms = 8;
}

message StallListReq {
  string item_id = 1;
  int32 count = 2;
  int32 unit_price_gold = 3;
}

message StallListResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  StallListingInfo listing = 4;
  repeated InventoryItem inventory = 5;
}

message StallBrowseReq {
  string item_id_filter = 1;
}

message StallBrowseResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  repeated StallListingInfo listings = 4;
}

message StallBuyReq {
  string listing_id = 1;
}

message StallBuyResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  StallListingInfo purchased = 4;
  int32 gold = 5;
  repeated InventoryItem inventory = 6;
}

message StallCancelReq {
  string listing_id = 1;
}

message StallCancelResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string listing_id = 4;
  repeated InventoryItem inventory = 5;
}

message StallSoldNotify {
  string listing_id = 1;
  string buyer_character_id = 2;
  string buyer_name = 3;
  string item_id = 4;
  int32 count = 5;
  int32 gross_gold = 6;
  int32 tax_gold = 7;
  int32 net_gold = 8;
  int32 new_gold = 9;
}

// 17. Party (MsgId: 2701–2710)
message PartyMemberInfo {
  string character_id = 1;
  string name = 2;
  string entity_id = 3;
  int32 level = 4;
  string map_id = 5;
  bool is_leader = 6;
  bool online = 7;
}

message PartyInviteReq {
  string target_name = 1;
}

message PartyInviteResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string party_id = 4;
  string target_name = 5;
}

message PartyInviteNotify {
  string party_id = 1;
  string inviter_character_id = 2;
  string inviter_name = 3;
}

message PartyAcceptReq {
  string party_id = 1;
  bool accept = 2;
}

message PartyAcceptResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string party_id = 4;
}

message PartyLeaveReq {}

message PartyLeaveResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
}

message PartyKickReq {
  string target_character_id = 1;
}

message PartyKickResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string kicked_character_id = 4;
}

message PartyInfoNotify {
  string party_id = 1;
  string leader_character_id = 2;
  repeated PartyMemberInfo members = 3;
  string reason = 4;
}

// 18. Friends (MsgId: 2711–2716)
message FriendInfo {
  string character_id = 1;
  string name = 2;
  bool online = 3;
}

message FriendAddReq {
  string friend_name = 1;
}

message FriendAddResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  FriendInfo friend = 4;
}

message FriendRemoveReq {
  string friend_character_id = 1;
}

message FriendRemoveResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string friend_character_id = 4;
}

message FriendListReq {}

message FriendListResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  repeated FriendInfo friends = 4;
}

// 19. Skills & Buffs (MsgId: 2801–2808)
message SkillState {
  string skill_id = 1;
  string display_name = 2;
  int32 level = 3;
  int32 exp = 4;
  int32 exp_to_next = 5;
  int32 max_level = 6;
}

message LearnSkillReq {
  string item_id = 1;   // skillbook item in inventory
  string skill_id = 2;  // optional explicit skill id
}

message LearnSkillResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  SkillState skill = 4;
  repeated InventoryItem inventory = 5;
}

message SkillListReq {}

message SkillListResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  repeated SkillState skills = 4;
}

message SkillListNotify {
  repeated SkillState skills = 1;
  string reason = 2; // learn | level_up | enter
}

message SkillLevelUpNotify {
  string skill_id = 1;
  int32 old_level = 2;
  int32 new_level = 3;
  int32 exp = 4;
  int32 exp_to_next = 5;
}

message BuffState {
  string buff_id = 1;
  string display_name = 2;
  string kind = 3; // buff | debuff
  int64 expires_at_unix_ms = 4;
  int32 stacks = 5;
  int32 atk_bonus_percent = 6;
  int32 def_bonus_percent = 7;
  int32 move_slow_percent = 8;
}

message BuffApplyNotify {
  BuffState buff = 1;
  string target_entity_id = 2;
  int32 effective_atk = 3;
  int32 effective_def = 4;
}

message BuffRemoveNotify {
  string buff_id = 1;
  string target_entity_id = 2;
  string reason = 3; // expire | death | dispel | replace
  int32 effective_atk = 4;
  int32 effective_def = 5;
}

// 17. M10 Siege / Sabuk Castle War (MsgId: 2901–2909)
message SiegeDeclareReq {
  string castle_id = 1;
}

message SiegeDeclareResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  int32 new_gold = 4;
  repeated string declared_guild_ids = 5;
  repeated string declared_guild_names = 6;
}

message SiegeStatusReq {
  string castle_id = 1;
}

message SiegeStatusResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string castle_id = 4;
  string castle_name = 5;
  bool is_active = 6;
  string owner_guild_id = 7;
