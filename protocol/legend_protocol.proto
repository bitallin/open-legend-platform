message GuildWarehouseListReq {}

message GuildWarehouseListResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string guild_id = 4;
  int32 capacity_slots = 5;
  int32 used_slots = 6;
  int32 max_stack_per_item = 7;
  bool can_deposit = 8;
  bool can_withdraw = 9;
  bool can_clear = 10;
  repeated InventoryItem items = 11;
}

message GuildWarehouseDepositReq {
  string item_id = 1;
  int32 count = 2;
}

message GuildWarehouseDepositResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  int32 used_slots = 4;
  repeated InventoryItem warehouse_items = 5;
  repeated InventoryItem inventory = 6;
}

message GuildWarehouseWithdrawReq {
  string item_id = 1;
  int32 count = 2;
}

message GuildWarehouseWithdrawResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  int32 used_slots = 4;
  repeated InventoryItem warehouse_items = 5;
  repeated InventoryItem inventory = 6;
}

message GuildWarehouseClearReq {}

message GuildWarehouseClearResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  int32 cleared_slots = 4;
}

// 26. Guild Ranks & Warehouse Audit (MsgId: 3701–3704) — M18
// Ranks: leader | vice_leader | warehouse_admin | member
// Leader appoints/dismisses vice_leader and warehouse_admin (and demotes to member).
// Clear permission: leader / vice_leader / warehouse_admin per guild.json; member uses memberCanClear.
message GuildSetRankReq {
  string target_character_id = 1;
  string rank = 2; // vice_leader | warehouse_admin | member
}

message GuildSetRankResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string target_character_id = 4;
  string target_name = 5;
  string old_rank = 6;
  string new_rank = 7;
}

message GuildWarehouseAuditEntry {
  string audit_id = 1;
  string actor_character_id = 2;
  string actor_name = 3;
  string action = 4; // deposit | withdraw | clear
  string item_id = 5;
  int32 count = 6;
  int64 created_unix_ms = 7;
}

message GuildWarehouseListAuditReq {
  int32 limit = 1; // 0 = use config auditLogLimit
}

message GuildWarehouseListAuditResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string guild_id = 4;
  repeated GuildWarehouseAuditEntry entries = 5;
}
