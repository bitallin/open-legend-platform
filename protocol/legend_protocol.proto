}

message MailEntry {
  string mail_id = 1;
  string from_name = 2;
  string subject = 3;
  string body = 4;
  int64 created_at_unix_ms = 5;
  bool is_read = 6;
  bool claimed = 7;
  MailAttachment attachments = 8;
  bool has_unclaimed_attachment = 9;
}

message MailListReq {}

message MailListResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  repeated MailEntry mails = 4;
  int32 capacity = 5;
}

message MailReadReq {
  string mail_id = 1;
}

message MailReadResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  MailEntry mail = 4;
}

message MailClaimAttachmentReq {
  string mail_id = 1;
}

message MailClaimAttachmentResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  MailEntry mail = 4;
  int32 gold = 5;
  repeated InventoryItem inventory = 6;
}

message MailDeleteReq {
  string mail_id = 1;
}

message MailDeleteResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
}

message MailNotify {
  MailEntry mail = 1;
}

message MailSendReq {
  string to_character_name = 1;
