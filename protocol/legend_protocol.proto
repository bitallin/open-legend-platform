}

// ========== M12/M13 Dungeon Instance + Party/Daily ==========
message DungeonEnterReq {
  string dungeon_id = 1;
  // true: pull eligible online party members on same map into the same instance
  bool party_enter = 2;
}

message DungeonEnterResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string dungeon_id = 4;
  string instance_id = 5;
  string map_id = 6;
  int32 x = 7;
  int32 y = 8;
  int32 remaining_kills = 9;
  int32 target_kills = 10;
  int32 gold = 11;
  int32 remaining_daily = 12;
  int32 daily_limit = 13;
}

message DungeonProgressNotify {
  string dungeon_id = 1;
  string instance_id = 2;
  int32 remaining_kills = 3;
  int32 target_kills = 4;
  int32 killed = 5;
}

message DungeonCompleteNotify {
  string dungeon_id = 1;
  string instance_id = 2;
  int32 reward_gold = 3;
  repeated InventoryItem reward_items = 4;
  bool rewards_mailed = 5;
  int32 gold = 6;
  string exit_map_id = 7;
  int32 exit_x = 8;
  int32 exit_y = 9;
}

message DungeonLeaveReq {}

message DungeonLeaveResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string map_id = 4;
  int32 x = 5;
  int32 y = 6;
}

message DungeonPartyMemberResult {
  string character_id = 1;
  string name = 2;
  bool entered = 3;
  ProtocolErrorCode error_code = 4;
  string message = 5;
}

// Broadcast to initiator (and optionally party) after party enter attempt
message DungeonPartyEnterNotify {
  string dungeon_id = 1;
  string instance_id = 2;
  repeated DungeonPartyMemberResult members = 3;
}

message DungeonStatusReq {
  string dungeon_id = 1;
}

message DungeonStatusResp {
  bool success = 1;
  ProtocolErrorCode error_code = 2;
  string message = 3;
  string dungeon_id = 4;
  int32 daily_limit = 5;
  int32 used_today = 6;
  int32 remaining_daily = 7;
  int32 cooldown_seconds = 8;
  int64 next_enter_unix = 9; // 0 if can enter now (unix seconds)
  bool can_enter = 10;
  int32 min_level = 11;
  int32 entry_cost_gold = 12;
}

